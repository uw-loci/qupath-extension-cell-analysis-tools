[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

# CUDA steering. This is the GPU variant: pixi validates the __cuda virtual
# package on EVERY install, so this manifest CANNOT install on a machine
# without an NVIDIA GPU -- which is exactly why the CPU variant exists and is
# the default. See documentation/GPU_ACCELERATION.md.
[system-requirements]
cuda = "12"

[dependencies]
python = "3.11.*"
# setuptools provides pkg_resources, which xarray_schema (transitive dep of
# spatialdata -> squidpy) still imports at module load. Modern Pixi envs do
# not preinstall setuptools, so squidpy import fails with
# ModuleNotFoundError: No module named 'pkg_resources' unless we pin it here.
# Cap < 81: setuptools 81 REMOVED the deprecated pkg_resources module, so a
# loose ">=65" now resolves to 81+ and reintroduces the exact import error we
# pinned this to fix. Keep on the 80.x line, which still ships pkg_resources.
setuptools = ">=65,<81"
appose = ">=0.7.2"
numpy = ">=1.24.0,<2.0"
pandas = ">=2.0"
scipy = ">=1.10"
scikit-learn = ">=1.5"
igraph = ">=0.11"
leidenalg = ">=0.10"
umap-learn = ">=0.5.5"
numba = ">=0.59"
matplotlib-base = ">=3.7"
h5py = ">=3.0"
# pyproj via conda-forge (includes PROJ C library; pip build fails on macOS)
pyproj = ">=3.6"
# PyTorch + torchvision. Left unconstrained on build: the CUDA steering above
# is what makes the solver choose CUDA variants here.
pytorch = ">=2.0.0"
torchvision = ">=0.15.0"
pillow = ">=10.0"

# pytorch-gpu steers the resolver to CUDA variants. Only exists for linux-64
# and win-64; macOS uses MPS through the plain pytorch build.
[target.linux-64.dependencies]
pytorch-gpu = ">=2.0.0"

[target.win-64.dependencies]
pytorch-gpu = ">=2.0.0"

[pypi-dependencies]
scanpy = ">=1.10"
anndata = ">=0.10"
seaborn = ">=0.13"
# Floor at 1.6.6, not 1.4.0. spatial_stats.py reads Ripley's L from
# uns[...]["L_stat"], which is the 1.6.6 shape -- older squidpy uses a
# different key and the read silently returns an EMPTY payload while logging
# success (the exact bug fixed in 0.9.x). A ">=1.4.0" floor let a routine
# lock regeneration resolve BACKWARDS to 1.5.0 and would have reintroduced it.
squidpy = ">=1.6.6"
# Pin the spatialdata/zarr chain. A fresh re-solve drifts to zarr 3.x, which
# REMOVED zarr.storage.BaseStore -- imported at load time by
# multiscale_spatial_image (squidpy -> spatialdata), so `import squidpy` dies.
# Same class of failure as the squidpy 1.6.6 -> 1.5.0 downgrade a loose floor
# allowed here previously. Diagnosed by @mikemcka on an HPC deployment:
# https://github.com/mikemcka/qupath-extension-cell-analysis-tools/pull/1
spatialdata = ">=0.4"
zarr = ">=2.18,<3"
# harmonypy 2.0.0+ is a pybind11/CMake build with no Windows wheel,
# which forces a source build that requires MSVC nmake on user machines.
# Pin <2 to stay on the pure-Python (py3-none-any) wheel that installs
# everywhere. 0.2.0 has the same run_harmony() entry point we call.
harmonypy = ">=0.2.0,<2"
# Upper bound at 1.4: run_clustering.py drives pybanksy's LOW-LEVEL API
# (it forges banksy_dict and calls generate_banksy_matrix directly), and
# that API is not stable across minor releases -- a loose ">=" previously
# landed an install on a build without the symbol we import (issue #4).
pybanksy = ">=1.3.4,<1.4"
scikit-image = ">=0.21"
# LLM Cluster Explainer [Beta] (v0.2.6+): Anthropic SDK + requests.
# requests is a DIRECT dependency, not transitive: huggingface-hub used to pull
# it in, and was dropped along with foundation-model feature extraction.
# Held below 1.0 deliberately. A lock regeneration whose purpose was removing
# two unrelated packages resolved anthropic 0.107 -> 1.2, a major bump we have
# not tested the LLM explainer against. Lift this on purpose, with a test, not
# as a side effect of some other change.
anthropic = ">=0.40.0,<1"
requests = ">=2.31"
